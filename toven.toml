[project]
name = "gokit"
root = "."
base_ref = "origin/main"

# Bound per-tool CPU parallelism during APPLY fan-out. gokit's `test`/`build`/
# `lint` tasks fan out one `go` process per module (50 modules) across the
# worker pool; left unbounded, every child defaults its own `GOMAXPROCS` to the
# whole machine and peak thread pressure climbs toward cores², thrashing the
# host. `auto` sizes a host-CPU budget and splits it across each concurrent
# wave, injecting each child's share via `GOMAXPROCS` (never argv). This is the
# default value; it is set explicitly here to document the intent. Use
# `inherit` (or `0`) to opt out and restore unbounded per-tool parallelism.
[toven]
compute_budget = "auto"

# Smart defaults fill in tasks, run strategy, and toolchain probes.
# Uncomment to override, e.g.:
#   run_strategy = "leaf-to-top"
[ecosystems.go]
modules = "auto"

[ecosystems.go.coverage]
changed_line = 85.0
enforcement = "advisory"
line = 80.0

# gokit publishes Go module tags only (no registry): Toven selects the changed
# modules, cuts Go path-prefixed tags, gates on a clean tree, supports an alpha
# prerelease channel, and cuts a hosted GitHub Release.
#
# Publishability decision — every discovered module, including the `testutil`
# and `bench` modules, is deliberately included in the release and tagged in
# lock-step. The `testutil` modules exist so a downstream consumer can
# import gokit's test helpers without pulling test-only dependencies into its
# production module graph, so they must carry consumable path-prefixed tags. The
# `bench` modules are internal but are ordinary Go modules under the same fixed
# tag scheme (`vX.Y.Z` at the root, `<path>/vX.Y.Z` for sub-modules). Toven does
# support a per-module `exclude` opt-out, but gokit's contract deliberately
# withholds none: the classification here is explicit inclusion of every module,
# not the absence of a mechanism. The Go tag grammar is fixed (Toven rejects a
# `tag_format` override).
#
# First-release note — gokit has no reachable release tags yet, so the version
# is tag-derived from none and the mutation-free previews (`release status` /
# `plan`) fail closed ("no reachable release tag") until the first version is
# cut. That first version is supplied explicitly to the mutating `release tag`
# action in step 04/05; Toven never fabricates a synthetic `0.0.0` baseline.
[ecosystems.go.release]
readiness = ["clean-tree"]

[ecosystems.go.release.prerelease]
channels = ["alpha"]

# go:gokit (the root module `github.com/kbukum/gokit`) fronts the single hosted
# GitHub Release. A hosted Release is opt-in per tag, so `host.forge` is declared
# only on the root module: its `vX.Y.Z` tag cuts the one hosted Release. Every
# other module is still tagged in lock-step with its own path-prefixed
# `<path>/vX.Y.Z` tag but, having no `host`, cuts no separate Release. Toven cuts
# and pushes the tags + this Release (`toven release publish`); pushing the root
# `v*` tag triggers `.github/workflows/release.yml`, where GoReleaser attaches
# artifacts to the existing Release (mode: keep-existing).
[modules."go:gokit".release.host]
forge = "github"

[ecosystems.go.tasks.build]
argv = ["go", "-C", "{module.root}", "build", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.check]
argv = ["go", "-C", "{module.root}", "vet", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.coverage]
argv = ["go", "test", "-coverprofile=target/toven/coverage/go-{module.name}.out", "{args}", "./..."]
cacheable = false
fan_out = "whole-workspace"
kind = "coverage"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.format]
argv = ["gofmt", "-s", "-w", "{args}", "{workspace.root}"]
cacheable = false
fan_out = "whole-workspace"
kind = "format"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.format-check]
argv = ["gofmt", "-s", "-l", "{args}", "{workspace.root}"]
fail_if_output = true
fan_out = "whole-workspace"
kind = "format"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.lint]
argv = ["golangci-lint", "run", "--allow-parallel-runners", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./{module.root}/..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.run]
argv = ["go", "-C", "{module.root}", "run", ".", "{args}"]
fan_out = "per-module"
persistent = true
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.test]
argv = ["go", "-C", "{module.root}", "test", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.tidy]
argv = ["go", "-C", "{module.root}", "mod", "tidy", "-diff", "{args}"]
fan_out = "per-module"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.tidy-fix]
argv = ["go", "-C", "{module.root}", "mod", "tidy", "{args}"]
cacheable = false
fan_out = "per-module"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.vuln]
argv = ["govulncheck", "-C", "{module.root}", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

# The `command` ecosystem is Toven's generic-tool adapter: language-agnostic
# gates that have no `go` home. Declaring gokit's structural guardrails here lets
# Toven drive the full validation surface, not just the `go` tasks. One module
# rooted at the repo root owns them all.
#
# Toven ORCHESTRATES these gokit-specific guardrails; it does not reimplement
# them. Each task shells out to the existing script (`scripts/*.sh`) so the rule
# logic stays script-owned with a single source of truth — the Makefile/CI and
# `toven run <task>` invoke the very same script.
#
# Two guardrails are deliberately NOT wired here and stay native (tracked in
# docs/TOVEN-MIGRATION.md):
#   - the change→domain projection (`scripts/affected-domains.sh`) is a stdin-fed
#     helper used by CI to shard work, not a runnable gate; and
#   - the dependency license gate (`scripts/check-licenses.sh`) is network-bound
#     and runs `go-licenses` across every module, exceeding Toven's bounded task
#     timeout — the same reason rskit keeps its `cargo-deny` gate native.
[[ecosystems.command.modules]]
name = "repo"
root = "."

# Declare-only aggregator / god-file / crowded-package advisory guard
# (ast-grep-backed). Advisory: it never gates. Mirrors `make structure`.
[ecosystems.command.tasks.structure]
argv = ["scripts/check-structure.sh", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

# Regenerate docs/MODULE-INDEX.md from discovered modules. A doc projection, so
# `kind = "doc"`; it mutates the working tree, so it is never cached.
[ecosystems.command.tasks.module-index]
argv = ["scripts/generate-module-index.sh", "{args}"]
cacheable = false
fan_out = "whole-workspace"
kind = "doc"
