[project]
name = "gokit"
root = "."
base_ref = "origin/main"
# Repo-wide inputs: a change here can affect every module, so affected runs
# check everything. Docs and other root files stay narrow.
global_inputs = [
  ".github/workflows/*",
  ".github/actions/*",
  "scripts/*",
  "Makefile",
  "toven.toml",
  "*.go.work",
  "gomod.sh",
  ".golangci.yml",
  "gosec.toml",
  "sgconfig.yml",
]

# Bound per-tool CPU parallelism during APPLY fan-out. gokit's `test`/`build`/
# `lint` tasks fan out one `go` process per module across the
# worker pool; left unbounded, every child defaults its own `GOMAXPROCS` to the
# whole machine and peak thread pressure climbs toward cores², thrashing the
# host. `auto` sizes a host-CPU budget and splits it across each concurrent
# wave, injecting each child's share via `GOMAXPROCS` (never argv). This is the
# default value; it is set explicitly here to document the intent. Use
# `inherit` (or `0`) to opt out and restore unbounded per-tool parallelism.
[toven]
compute_budget = "auto"

# Smart defaults fill in tasks, run strategy, and toolchain probes.
# Uncomment to override, e.g.:
#   run_strategy = "leaf-to-top"
[ecosystems.go]
modules = "auto"

# Every module is gated on its line floor. There is no `changed_line` floor for now:
# Toven measures it over whole changed files, so it would block any edit to a file
# whose behavior the integration suite proves. Codecov reports patch coverage.
[ecosystems.go.coverage]
enforcement = "block"
line = 80.0
# Test-support modules are measured but not gated, matching codecov.yml: they exist to support other modules' tests.
exclude = [
  "connect-testutil",
  "dag-testutil",
  "database-postgres-testutil",
  "database-testutil",
  "discovery-testutil",
  "git-testutil",
  "messaging-nats-testutil",
  "server-testutil",
  "storage-s3-testutil",
  "storage-testutil",
  "testutil",
  "workload-testutil",
]

# For now: ratchets at today's coverage for modules still below the floor, so they cannot slip further.
# Raise them as tests land and delete them once a module reaches the default floor.
# database/postgres is mostly proven by the integration suite in database/postgres/testutil.
[modules."go:database-postgres".coverage]
line = 49.0

[modules."go:messaging-rabbitmq".coverage]
line = 76.0

# gokit publishes Go module tags only (no registry): Toven selects the changed
# modules, cuts Go path-prefixed tags, gates on a clean tree, supports an alpha
# prerelease channel, and cuts a hosted GitHub Release.
#
# Publishability decision — every discovered module, including the `testutil`
# and `bench` modules, is deliberately included in the release and tagged in
# lock-step. The `testutil` modules exist so a downstream consumer can
# import gokit's test helpers without pulling test-only dependencies into its
# production module graph, so they must carry consumable path-prefixed tags. The
# `bench` modules are internal but are ordinary Go modules under the same fixed
# tag scheme (`vX.Y.Z` at the root, `<path>/vX.Y.Z` for sub-modules). Toven does
# support a per-module `exclude` opt-out, but gokit's contract deliberately
# withholds none: the classification here is explicit inclusion of every module,
# not the absence of a mechanism. The Go tag grammar is fixed (Toven rejects a
# `tag_format` override).
#
# Version baseline — the last published line is `v0.2.0` (immutable on the Go
# module proxy for the root and every module that existed then). Toven anchors
# on reachable git tags, so `release status` / `release plan` work: modules that
# carry a `v0.2.0` tag auto-bump from their Conventional-Commit history (e.g.
# `authz 0.2.0 → 0.2.1`). Modules added since v0.2.0 (media, agent, ai, …) have
# no tag and no declared version, so `release plan` fails closed on them until a
# first version is supplied. Cross-check the proxy before choosing a version:
# gokit's remote currently carries no `v*` tags even though the proxy has cached
# up to `v0.2.0`, so the next version must be strictly greater than everything
# published on every module path. Supply the version to the mutating action —
# `--set-version <version>` (workspace-wide) or `--set-version go:<mod>=<version>`
# is accepted on `release bump`, `release tag`, and `release publish`, and the
# version carries no `v` prefix (e.g. `--set-version 0.3.0-alpha.1`). Toven never
# fabricates a synthetic `0.0.0` baseline.
[ecosystems.go.release]
readiness = ["clean-tree"]
# gokit's release branch (`main`) is protected: it rejects any non-PR push to
# `refs/heads/main`. Toven's default publish pushes the release commit's branch
# alongside the tags, which that protection declines. gokit publishes Go module
# tags only, and the version bump already lands on `main` through the Phase-1
# bump PR, so the release needs no branch push: tag `main`'s merged HEAD and push
# the tags alone. `push_branch = false` selects that tags-only mode.
push_branch = false

[ecosystems.go.release.prerelease]
channels = ["alpha"]

# go:gokit (the root module `github.com/kbukum/gokit`) fronts the single hosted
# GitHub Release. A hosted Release is opt-in per tag, so `host.forge` is declared
# only on the root module: its `vX.Y.Z` tag cuts the one hosted Release. Every
# other module is still tagged in lock-step with its own path-prefixed
# `<path>/vX.Y.Z` tag but, having no `host`, cuts no separate Release. Toven cuts
# and pushes the tags + this Release (`toven release publish`); pushing the root
# `v*` tag triggers `.github/workflows/release.yml`, where GoReleaser attaches
# artifacts to the existing Release (mode: keep-existing).
[modules."go:gokit".release.host]
forge = "github"

[ecosystems.go.tasks.build]
argv = ["go", "-C", "{module.root}", "build", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.check]
argv = ["go", "-C", "{module.root}", "vet", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.coverage]
# The full test run: every module in parallel under -race, writing one profile
# per module. scripts/go-cover.sh owns the flags and honours a module's
# `.coverpkg`. Toven maps profile import paths back to modules and gates them;
# CI uploads the same profiles to Codecov.
argv = ["{workspace.root}/scripts/go-cover.sh", "{module.root}", "{workspace.root}/target/toven/coverage/go-{module.name}.out", "{args}"]
cacheable = false
fan_out = "per-module"
kind = "coverage"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.format]
argv = ["gofmt", "-s", "-w", "{args}", "{workspace.root}"]
cacheable = false
fan_out = "whole-workspace"
kind = "format"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.format-check]
argv = ["gofmt", "-s", "-l", "{args}", "{workspace.root}"]
fail_if_output = true
fan_out = "whole-workspace"
kind = "format"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.lint]
argv = ["golangci-lint", "run", "--allow-parallel-runners", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./{module.root}/..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.licenses]
# Dependency license allow-list per module (needs go-licenses; network-bound,
# so never cached). `make licenses` runs the same script over every module.
argv = ["scripts/check-licenses.sh", "{module.root}"]
cacheable = false
fan_out = "per-module"
kind = "lint"

[ecosystems.go.tasks.run]
argv = ["go", "-C", "{module.root}", "run", ".", "{args}"]
fan_out = "per-module"
persistent = true
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.test]
argv = ["go", "-C", "{module.root}", "test", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.tidy]
argv = ["go", "-C", "{module.root}", "mod", "tidy", "-diff", "{args}"]
fan_out = "per-module"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.tidy-fix]
argv = ["go", "-C", "{module.root}", "mod", "tidy", "{args}"]
cacheable = false
fan_out = "per-module"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.update]
argv = ["go", "-C", "{module.root}", "get", "-u", "-t", "{args}", "{module.selector}"]
cacheable = false
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.vuln]
argv = ["python3", "{workspace.root}/scripts/govulncheck.py", "--module", "{module.root}", "--", "{args}", "{module.selector}"]
cacheable = false
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

# Domains: every module belongs to one group. `toven <task> --group <name>`
# runs a domain, `toven groups` lists them (and feeds docs/MODULE-INDEX.md).
# Group dependencies come from the real module graph; `allow_groups` only
# limits which other domains a group may depend on, and Toven fails any run
# whose graph breaks that layering. Package layering inside the root module is
# described in docs/ARCHITECTURE.md; depguard bans only selected edges.
[groups.foundation]
description = "Root module packages: foundation types, config, logging, validation, encryption, codec, fs, schema; shared test helpers (testutil); component lifecycle, providers, DI, hooks; observability, resilience, security; bootstrap, stream, DAG, chain, worker, process; SSE; CLI"
ecosystem = "go"
modules = ["gokit", "schema", "testutil"]
guardrails.allow_groups = []

[groups.composition]
description = "Stateful state stores and DAG test helpers"
ecosystem = "go"
modules = ["dag-testutil", "stateful"]
guardrails.allow_groups = ["foundation"]

[groups.devtools]
description = "Developer tooling: git"
ecosystem = "go"
modules = ["git", "git-testutil"]
guardrails.allow_groups = ["foundation"]

[groups.transport]
description = "Server, HTTP client, gRPC, connect, discovery"
ecosystem = "go"
modules = ["server", "server-testutil", "httpclient", "grpc", "connect", "connect-testutil", "discovery", "discovery-testutil"]
guardrails.allow_groups = ["foundation"]

[groups.auth]
description = "Authentication and authorization"
ecosystem = "go"
modules = ["auth", "authz"]
guardrails.allow_groups = ["foundation", "transport"]

[groups.data]
description = "Database, cache, storage, vectorstore, messaging"
ecosystem = "go"
modules = ["database", "database-postgres", "database-postgres-testutil", "database-sqlite", "database-testutil", "auth-session-database", "cache", "cache-redis", "storage", "storage-s3", "storage-s3-testutil", "storage-gcs", "storage-testutil", "vectorstore", "vectorstore-qdrant", "messaging", "messaging-kafka", "messaging-nats", "messaging-nats-testutil", "messaging-rabbitmq"]
guardrails.allow_groups = ["foundation", "transport", "auth"]

[groups.ai]
description = "LLM, inference, embedding, agent, tool, MCP, skill"
ecosystem = "go"
modules = ["ai", "llm", "llm-providers", "llm-tokenizer-tiktoken", "llm-tokenizer-huggingface", "embedding", "inference", "inference-tgi", "inference-triton", "inference-vllm", "agent", "tool", "mcp", "skill"]
guardrails.allow_groups = ["foundation", "transport", "auth"]

[groups.media]
description = "Light detection, metadata, image ops, time/spatial, subtitles"
ecosystem = "go"
modules = ["media"]
guardrails.allow_groups = ["foundation"]

[groups.infra]
description = "Workload management, benchmarking, dataset, auth test host"
ecosystem = "go"
modules = ["workload", "workload-dmr", "workload-lmstudio", "workload-ollama", "workload-openaicompat", "workload-testutil", "dataset", "bench", "bench-storage", "auth-testhost"]
guardrails.allow_groups = ["foundation", "transport", "auth", "data", "ai"]

# The `command` ecosystem is Toven's generic-tool adapter: language-agnostic
# gates that have no `go` home. Declaring gokit's structural guardrails here lets
# Toven drive the full validation surface, not just the `go` tasks. One module
# rooted at the repo root owns them all.
#
# Toven ORCHESTRATES these gokit-specific guardrails; it does not reimplement
# them. Each task shells out to the existing script (`scripts/*.sh`) so the rule
# logic stays script-owned with a single source of truth — the Makefile/CI and
# `toven run <task>` invoke the very same script.
#
[[ecosystems.command.modules]]
name = "repo"
root = "."

# Declare-only aggregator / god-file / crowded-package advisory guard
# (ast-grep-backed). Advisory: it never gates. Mirrors `make structure`.
[ecosystems.command.tasks.structure]
argv = ["scripts/check-structure.sh", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

# Regenerate docs/MODULE-INDEX.md from discovered modules. A doc projection, so
# `kind = "doc"`; it mutates the working tree, so it is never cached.
[ecosystems.command.tasks.module-index]
argv = ["scripts/generate-module-index.sh", "{args}"]
cacheable = false
fan_out = "whole-workspace"
kind = "doc"
