name: Toven canary

# Read-only, mutation-free Toven canary. It installs the pinned, published Toven
# release through the reusable `kbukum/toven` action — a thin wrapper over the
# same reference install contract (`scripts/install.sh`, bundled at the action's
# pinned commit) that verifies the archive checksum and, with cosign present,
# the keyless Sigstore signature over `SHA256SUMS` — then drives gokit's
# discovery and release previews through that binary via `make toven-canary`.
#
# The action is pinned by immutable commit SHA and installs the Toven release
# built from that same commit, so the SHA is the only pin to bump.
#
# This proves the published Toven artifact, its installation instructions, its
# least-privilege permissions, and its command-line contract work in a real
# downstream workflow. It never publishes and never mutates the repository:
# Toven owns the authoritative release tag/publish path, and GoReleaser only
# attaches supply-chain artifacts to the Toven-created Release. gokit has no
# reachable release tag yet, so the release previews fail closed with "no
# reachable release tag"; `make toven-canary` tolerates exactly that documented
# outcome and fails on anything else.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toven-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Toven action canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history feeds the release-preview change detection and semver
          # cascade; a shallow clone would hide the reachable tags they walk.
          fetch-depth: 0

      - name: Install the pinned Toven release
        id: toven
        # Pinned by immutable commit SHA; the `version` input independently pins
        # the installed binary. The action wraps the same `scripts/install.sh`
        # contract: on a cache miss it installs cosign and verifies the archive
        # checksum and the Sigstore signature over SHA256SUMS before extraction;
        # a version-exact cache hit reuses the already-verified binary.
        uses: kbukum/toven/.github/actions/toven@4af3e339b1bade7811c705c886ec07cac94d3362 # v0.1.0-alpha.17

      - name: Show the installed Toven version
        run: |
          "${{ steps.toven.outputs.toven }}" --version

      - name: Toven canary (discovery + release previews)
        run: make TOVEN="${{ steps.toven.outputs.toven }}" toven-canary
