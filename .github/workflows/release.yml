name: Release (publish)

# Authoritative Go release entrypoint, dispatched from the Actions UI. This
# workflow never triggers on a v* tag push — it *creates* those tags itself,
# through `toven release publish`, so a tag-triggered run would race a preflight
# that fails closed on an already-existing tag (that tag push instead triggers
# release-artifacts.yml, the GoReleaser artifact stage).
#
# Phase 1 (version bump) is a normal PR: the maintainer cuts a release branch,
# runs `make release-bump`, rotates the CHANGELOG, and merges into main. Phase 2
# is this workflow: it publishes the merged main. The single trigger is an
# explicit, human dispatch; the mutating `publish` job is gated by the protected
# `release` GitHub environment — configure it once with required reviewers before
# the first dispatch. Integrity comes from that approval gate plus the cosign and
# SLSA provenance that release-artifacts.yml cuts over the published assets, not
# from GPG-signed tags (CI cuts annotated tags under the github-actions[bot]
# identity, mirroring Toven's own release pipeline).

on:
  workflow_dispatch:
    inputs:
      set_version:
        description: >-
          First version for modules that carry no prior tag (added since v0.2.0),
          with no `v` prefix, e.g. 0.3.0-alpha.1. Maps to `--set-version`. Leave
          empty once every module carries a tag and history alone drives the bump.
        required: false
        type: string
      dry_run:
        description: >-
          Preview only. Runs the mutation-free rehearsal and skips the publish
          job entirely (no environment approval requested, nothing pushed).
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  TOVEN_VERSION: v0.1.0-alpha.9

jobs:
  # Mutation-free rehearsal: the exact plan a real publish would use, preserved
  # as review evidence for the `release` environment's required reviewers before
  # they approve the publish job. Runs on every dispatch, dry-run or not.
  preview:
    name: Release preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main with full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned Toven release
        id: toven
        # Pinned by immutable commit SHA; `version` independently pins the
        # installed binary (dual pin, both required). Same pin as ci.yml.
        uses: kbukum/toven/.github/actions/toven@725f880affda10f0db823275802ce554b82a4e97 # v0.1.0-alpha.9
        with:
          version: ${{ env.TOVEN_VERSION }}
          install-cosign: "true"

      - name: Discover modules and dependency graph
        run: make TOVEN="${{ steps.toven.outputs.toven }}" toven-canary

      - name: Rehearse the publish (mutation-free)
        run: |
          make TOVEN="${{ steps.toven.outputs.toven }}" \
            SET_VERSION="${{ inputs.set_version }}" \
            release-publish-dry-run | tee release-preview.txt

      - name: Upload preview evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: release-preview.txt
          if-no-files-found: error
          retention-days: 14

  # Real publish: cuts and pushes the lock-step tags and creates the hosted
  # Release with commit-derived notes. Gated by the protected `release`
  # environment; skipped on a dry-run dispatch. The pushed root v* tag then
  # triggers release-artifacts.yml (GoReleaser) to attach supply-chain artifacts.
  publish:
    name: Publish the release
    needs: preview
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write   # push tags and create the hosted Release
    steps:
      - name: Checkout main with full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Toven cuts annotated tags through the embedded git backend, which builds
      # the tagger/committer signature from git config. actions/checkout sets the
      # auth token but no identity, so without this the tag creation aborts. Use
      # the GitHub Actions bot identity, mirroring Toven's own release pipeline.
      - name: Configure git identity for the release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install the pinned Toven release
        id: toven
        uses: kbukum/toven/.github/actions/toven@725f880affda10f0db823275802ce554b82a4e97 # v0.1.0-alpha.9
        with:
          version: ${{ env.TOVEN_VERSION }}
          install-cosign: "true"

      - name: Publish the release
        env:
          # Toven's embedded git backend reads whichever of these is set to
          # authenticate the tag push and to create the hosted Release.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          make TOVEN="${{ steps.toven.outputs.toven }}" \
            SET_VERSION="${{ inputs.set_version }}" \
            release-publish | tee release-publish.txt

      - name: Upload publish record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-record
          path: release-publish.txt
          if-no-files-found: error
          retention-days: 90
