name: CI

# One workflow proves every change. The gate job decides scope and plans the
# fuzz shards; every other job runs the same Make targets developers run locally.
# `CI Status` is the single required check, so it must report on every PR,
# including docs-only ones where the Go jobs are skipped.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    # Nightly: full suite on the latest Go plus a long fuzz campaign.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Fuzz time per target (positive Go duration; at most 11m, as a shard runs up to 8 targets in 90 minutes)
        required: false
        default: 30s

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Pinned Toven release; keep in lock-step with .github/workflows/toven-canary.yml.
# Third-party actions are pinned by 40-char SHA; Dependabot bumps SHA and comment together.
env:
  TOVEN_VERSION: v0.1.0-alpha.14

jobs:
  # ── Gate: scope, repo guardrails, and the fuzz plan ───────────────────────
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.scope.outputs.code }}
      go-floor: ${{ steps.go.outputs.floor }}
      go-versions: ${{ steps.go.outputs.versions }}
      fuzz-groups: ${{ steps.fuzz.outputs.groups }}
      fuzz-total: ${{ steps.fuzz.outputs.total }}
      fuzz-modules: ${{ steps.fuzz.outputs.modules }}
      fuzz-time: ${{ steps.fuzz.outputs.time }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pull requests that only touch docs skip the Go jobs; every other event runs everything.
      - name: Decide scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            # Capture first: a failed diff must fail the gate, never read as "docs only".
            changed=$(git diff --name-only "$BASE_SHA...HEAD")
            if [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/|^LICENSE$|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/)' <<<"$changed"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

      # The root go.mod directive is the supported floor; every module declares it.
      - name: Verify uniform Go version across modules
        id: floor
        if: steps.scope.outputs.code == 'true'
        run: |
          set -euo pipefail
          floor=$(sed -n 's/^go //p' go.mod)
          versions=$(git ls-files '*go.mod' | xargs sed -n 's/^go //p' | sort -u)
          if [ "$versions" != "$floor" ]; then
            echo "::error::Every go.mod must declare go $floor (the root floor); found: ${versions//$'\n'/ }"
            exit 1
          fi
          echo "floor=$floor" >> "$GITHUB_OUTPUT"

      # Runs on docs-only changes too, since they can edit the CHANGELOG.
      - name: Validate CHANGELOG unreleased heading
        run: ./scripts/check_changelog_unreleased.sh

      - id: setup-go
        if: steps.scope.outputs.code == 'true'
        uses: ./.github/actions/setup-go
        with:
          cache-name: gate

      - name: Install the pinned Toven release
        id: toven
        if: steps.scope.outputs.code == 'true'
        uses: kbukum/toven/.github/actions/toven@38bdaeb81c983a8bb2da0573e15f403032a5d2a2 # v0.1.0-alpha.14
        with:
          version: ${{ env.TOVEN_VERSION }}

      - name: Test CI scripts
        if: steps.scope.outputs.code == 'true'
        env:
          TOVEN: ${{ steps.toven.outputs.toven }}
        run: |
          python3 -m pip install -r scripts/requirements-test.txt
          python3 -m pytest -q scripts/test_govulncheck.py scripts/test_module_replaces.py \
            scripts/test_fuzz.py scripts/test_integration_modules.py
          python3 -m unittest discover -s scripts -p test_validation.py

      - name: Lint workflows
        if: steps.scope.outputs.code == 'true'
        run: make actionlint

      - name: Verify the intra-repo replace graph
        if: steps.scope.outputs.code == 'true'
        run: make replace-check

      - name: Verify modules are tidy
        if: steps.scope.outputs.code == 'true'
        run: make TOVEN="${{ steps.toven.outputs.toven }}" tidy-check

      # The floor plus the latest release when it is newer, so a new toolchain
      # cannot silently break the build.
      - name: Choose Go versions
        id: go
        if: steps.scope.outputs.code == 'true'
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSL --retry 5 --retry-all-errors --max-time 30 'https://go.dev/VERSION?m=text' | head -1)
          versions="[\"$FLOOR\"]"
          [ "${latest#go}" = "$FLOOR" ] || versions="[\"$FLOOR\",\"stable\"]"
          { echo "floor=$FLOOR"; echo "versions=$versions"; } | tee -a "$GITHUB_OUTPUT"

      # Pull requests fuzz the modules their change affects; main, the merge
      # queue, the nightly run and manual runs fuzz everything.
      - name: Plan fuzz shards
        id: fuzz
        if: steps.scope.outputs.code == 'true'
        env:
          TOVEN: ${{ steps.toven.outputs.toven }}
          FUZZ_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TIME: ${{ inputs.fuzztime }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule) time=5m ;;
            workflow_dispatch) time=${DISPATCH_TIME:-30s} ;;
            *) time=30s ;;
          esac
          # The plan refuses a manual input that is not a positive Go duration
          # or that would overrun a shard, before it reaches GITHUB_OUTPUT.
          plan=$(python3 scripts/fuzz.py plan --fuzztime "$time")
          echo "$plan"
          {
            echo "groups=$(jq -c .group <<<"$plan")"
            echo "total=$(jq .groups <<<"$plan")"
            echo "modules=$(jq -c .modules <<<"$plan")"
            echo "time=$(jq -r .fuzztime <<<"$plan")"
          } >> "$GITHUB_OUTPUT"

      - name: Save Go cache
        if: steps.scope.outputs.code == 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.cache-paths }}
          key: ${{ steps.setup-go.outputs.cache-key }}

  # ── Build, vet, race tests and the coverage gate ──────────────────────────
  check:
    name: Check (Go ${{ matrix.go }})
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(needs.gate.outputs.go-versions) }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go }}
          cache-name: check

      - name: Install the pinned Toven release
        id: toven
        uses: kbukum/toven/.github/actions/toven@38bdaeb81c983a8bb2da0573e15f403032a5d2a2 # v0.1.0-alpha.14
        with:
          version: ${{ env.TOVEN_VERSION }}

      # test-coverage is the full race test run: every module with -race and
      # -shuffle, gated per module by [ecosystems.go.coverage] in toven.toml.
      - name: Build, vet, test with coverage
        run: make TOVEN="${{ steps.toven.outputs.toven }}" build vet test-coverage

      - name: List coverage profiles
        id: coverage
        if: matrix.go == needs.gate.outputs.go-floor
        run: echo "files=$(find target/toven/coverage -name '*.out' | sort | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        if: matrix.go == needs.gate.outputs.go-floor && github.event_name != 'merge_group'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.coverage.outputs.files }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.cache-paths }}
          key: ${{ steps.setup-go.outputs.cache-key }}

  # ── Cross-OS tests for platform-sensitive modules ─────────────────────────
  check-cross:
    name: Check (${{ matrix.module }} / ${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: storage
            os: macos-latest
          - module: server
            os: macos-latest
          - module: workload
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-name: cross-${{ matrix.module }}

      - name: Build and test
        run: make check M=${{ matrix.module }}

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.cache-paths }}
          key: ${{ steps.setup-go.outputs.cache-key }}

  # ── Lint (gosec runs inside golangci-lint; see .golangci.yml) ─────────────
  lint:
    name: Lint
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOLANGCI_LINT_VERSION: 2.14.0
      GOLANGCI_LINT_SHA256: ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-name: lint

      # Prebuilt, checksum-verified release binary: faster than `go install`
      # and identical to the version developers pin.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          name="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          curl -fsSL --retry 3 -o /tmp/gcl.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${name}.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  /tmp/gcl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gcl.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/${name}/golangci-lint" /usr/local/bin/golangci-lint
          golangci-lint version

      - name: Install the pinned Toven release
        id: toven
        uses: kbukum/toven/.github/actions/toven@38bdaeb81c983a8bb2da0573e15f403032a5d2a2 # v0.1.0-alpha.14
        with:
          version: ${{ env.TOVEN_VERSION }}

      - name: Lint all modules
        run: make TOVEN="${{ steps.toven.outputs.toven }}" lint

      - name: Structure guard (advisory)
        continue-on-error: true
        run: make TOVEN="${{ steps.toven.outputs.toven }}" structure

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.cache-paths }}
          key: ${{ steps.setup-go.outputs.cache-key }}

  # ── Known vulnerabilities (reviewed suppressions only) ────────────────────
  security:
    name: Security
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-name: security

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Install the pinned Toven release
        id: toven
        uses: kbukum/toven/.github/actions/toven@38bdaeb81c983a8bb2da0573e15f403032a5d2a2 # v0.1.0-alpha.14
        with:
          version: ${{ env.TOVEN_VERSION }}

      - name: Scan every module
        run: make TOVEN="${{ steps.toven.outputs.toven }}" vuln

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.cache-paths }}
          key: ${{ steps.setup-go.outputs.cache-key }}

  # ── Fuzz: balanced shards, each target in exactly one shard ───────────────
  fuzz:
    name: Fuzz (${{ matrix.group }}/${{ needs.gate.outputs.fuzz-total }})
    needs: gate
    if: needs.gate.outputs.code == 'true' && needs.gate.outputs.fuzz-groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.gate.outputs.fuzz-groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: ./.github/actions/setup-go
        with:
          # One namespace per shard keeps each shard's generated corpus in GOCACHE.
          cache-name: fuzz-${{ matrix.group }}

      - name: Fuzz shard ${{ matrix.group }}
        env:
          FUZZ_MODULES: ${{ needs.gate.outputs.fuzz-modules }}
          FUZZ_GROUP: ${{ matrix.group }}
          # Not GROUPS: bash reserves it for the caller's group IDs and ignores the env value.
          FUZZ_GROUPS: ${{ needs.gate.outputs.fuzz-total }}
          FUZZ_TIME: ${{ needs.gate.outputs.fuzz-time }}
        run: >-
          python3 scripts/fuzz.py run
          --group "$FUZZ_GROUP" --groups "$FUZZ_GROUPS"
          --fuzztime "$FUZZ_TIME"
          --failures target/fuzz-failures

      # Failing inputs to reproduce locally: copy into the package's testdata/fuzz.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.group }}
          path: target/fuzz-failures
          if-no-files-found: ignore

      # Main pushes and the nightly campaign keep every shard's corpus; pull requests only restore.
      - name: Save Go cache
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.cache-paths }}
          key: ${{ steps.setup-go.outputs.cache-key }}

  # ── Dependency license allow-list (scripts/check-licenses.sh) ─────────────
  licenses:
    name: Licenses
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-name: licenses

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Check dependency licenses
        run: make licenses

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.cache-paths }}
          key: ${{ steps.setup-go.outputs.cache-key }}

  # ── Integration: modules with //go:build integration (Docker services) ────
  integration:
    name: Integration
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-name: integration

      - name: Install the pinned Toven release
        id: toven
        uses: kbukum/toven/.github/actions/toven@38bdaeb81c983a8bb2da0573e15f403032a5d2a2 # v0.1.0-alpha.14
        with:
          version: ${{ env.TOVEN_VERSION }}

      - name: Run integration tests
        run: make TOVEN="${{ steps.toven.outputs.toven }}" test-integration

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.cache-paths }}
          key: ${{ steps.setup-go.outputs.cache-key }}

  # ── The single required check ─────────────────────────────────────────────
  ci-status:
    name: CI Status
    if: always()
    needs: [gate, check, check-cross, lint, security, fuzz, licenses, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The gate must pass. When it chose to run the Go jobs, each must succeed;
      # fuzz may skip only when the change affects no fuzz targets.
      - name: Evaluate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          code=$(jq -r '.gate.outputs.code // "false"' <<<"$NEEDS")
          groups=$(jq -r '.gate.outputs["fuzz-groups"] // "[]"' <<<"$NEEDS")
          failed=0
          while IFS=$'\t' read -r job result; do
            ok=false
            case "$result" in
              success) ok=true ;;
              skipped)
                if [ "$job" != gate ] && { [ "$code" != true ] || { [ "$job" = fuzz ] && [ "$groups" = '[]' ]; }; }; then
                  ok=true
                fi ;;
            esac
            echo "$job: $result"
            [ "$ok" = true ] || { echo "::error::$job did not succeed ($result)"; failed=1; }
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS")
          exit $failed
